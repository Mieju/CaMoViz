<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaMoViz</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D canvas fills the viewport; mesh is the hero. -->
  <div id="viewport"></div>

  <!-- Landing overlay: drop zone + example fallback. Hidden once a mesh loads. -->
  <div id="overlay" class="overlay">
    <div id="dropzone" class="dropzone">
      <h1>CaMoViz</h1>
      <p class="sub">Drag &amp; drop a <code>.vtu</code> / <code>.vtp</code> / <code>.vtk</code> surface mesh</p>
      <button id="pick-btn" class="btn" type="button">Choose file…</button>
      <div class="or">or</div>
      <button id="example-btn" class="btn btn-ghost" type="button">Load example heart mesh</button>
      <input id="file-input" type="file" accept=".vtu,.vtp,.vtk" hidden />
    </div>
  </div>

  <!-- Loading + error toast. -->
  <div id="toast" class="toast" hidden></div>

  <!-- Controls relocated into the left dock at startup (see main.js). This holder
       stays hidden; its children are moved into dock sections so their existing
       handlers keep working. -->
  <div id="controls" class="controls" hidden>
    <button id="reopen-btn" type="button">Load another mesh</button>
    <button id="leads-toggle" type="button">Show ECG leads</button>
    <div id="cam-card" class="cam-card">
      <button id="cam-reset" class="cam-btn" type="button">⟲ Reset view</button>
      <div class="cam-views">
        <span class="cam-label">Saved views</span>
        <div class="cam-slot">
          <button class="cam-jump" data-slot="0" type="button" disabled>1</button>
          <button class="cam-set" data-slot="0" type="button" title="Save current view">＋</button>
        </div>
        <div class="cam-slot">
          <button class="cam-jump" data-slot="1" type="button" disabled>2</button>
          <button class="cam-set" data-slot="1" type="button" title="Save current view">＋</button>
        </div>
        <div class="cam-slot">
          <button class="cam-jump" data-slot="2" type="button" disabled>3</button>
          <button class="cam-set" data-slot="2" type="button" title="Save current view">＋</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Top-center playback transport: pause/resume + simulation speed. -->
  <div id="transport" class="transport" hidden>
    <button id="tp-play" class="tp-btn" type="button" aria-label="Pause" title="Pause / resume (Space)">⏸</button>
    <div class="tp-speeds" role="group" aria-label="Simulation speed">
      <button class="tp-speed" data-speed="0.25" type="button">0.25×</button>
      <button class="tp-speed" data-speed="0.5" type="button">0.5×</button>
      <button class="tp-speed active" data-speed="1" type="button">1×</button>
      <button class="tp-speed" data-speed="2" type="button">2×</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
